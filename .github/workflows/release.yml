# Builds a signed APK when a version tag (v1.0.1, v1.1.0, ...) is pushed and
# attaches it to a GitHub Release. Signing material comes from Actions secrets:
#   KC_KEYSTORE_BASE64   the .jks file, base64-encoded
#   KC_KEYSTORE_PASSWORD keystore password
#   KC_KEY_ALIAS         key alias (kitchen-collection)
#   KC_KEY_PASSWORD      key password
name: Release APK

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci

      - name: Check the tag matches package.json
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$expected" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $expected"; exit 1
          fi

      - name: Test
        run: npm test

      - name: Build web app and sync Android
        run: |
          npm run build
          npx cap sync android

      - name: Decode signing key
        env:
          KC_KEYSTORE_BASE64: ${{ secrets.KC_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KC_KEYSTORE_BASE64" ]; then echo "Missing KC_KEYSTORE_BASE64 secret"; exit 1; fi
          echo "$KC_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build signed APK
        working-directory: android
        env:
          KC_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KC_KEYSTORE_PASSWORD: ${{ secrets.KC_KEYSTORE_PASSWORD }}
          KC_KEY_ALIAS: ${{ secrets.KC_KEY_ALIAS }}
          KC_KEY_PASSWORD: ${{ secrets.KC_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verify signature
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -n1)apksigner"
          "$apksigner" verify --print-certs android/app/build/outputs/apk/release/app-release.apk

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="kitchen-collection-$GITHUB_REF_NAME.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$apk"
          gh release create "$GITHUB_REF_NAME" "$apk" --title "Kitchen Collection $GITHUB_REF_NAME" --generate-notes

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
