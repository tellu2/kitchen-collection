/* ============================================================
   Shopping list grouping
   Lines are stored one per recipe so a recipe can be removed
   cleanly. They are grouped at display time: the same item from
   different recipes shows once, with each recipe's amount below.
   Grams and millilitres are totalled; other units are listed.
   ============================================================ */
function shopBaseName(line){
  let x = line.replace(LEAD, '');
  for(let i=0;i<3;i++) x = x.replace(/^\s*(kg|g|ml|l|tsp|tbsp|cups?|pinch|bunch|handful|small|medium|large|heaped|level|x)\b\.?\s*(of\s+)?/i, '');
  x = x.split(/[,(]/)[0].trim().toLowerCase();
  return x || line.toLowerCase();
}
function singular(x){
  if(/leaves$/.test(x)) return x.slice(0,-6) + 'leaf';
  if(/oes$/.test(x)) return x.slice(0,-2);
  if(x.length > 3 && /[^su]s$/.test(x)) return x.slice(0,-1);
  return x;
}
function shopGroupOf(line){
  /* Match on the item name only, so a description such as
     'salt, for drawing water from the tomatoes' is not filed under tomatoes. */
  let n = shopBaseName(line);
  const generic = /\bground\b|powder|\bdried\b|peanut butter|almond butter|\bflakes?\b/i.test(n);
  const k = generic ? null : lineKey(n);
  if(k) return {key:'k:'+k, label:k};
  n = singular(n);
  return {key:'n:'+n, label:n.charAt(0).toUpperCase()+n.slice(1)};
}
function shopQty(line){
  const m = line.match(LEAD);
  if(!m || !m[2] || m[4]) return null;
  const u = line.slice(m[0].length).match(/^\s*(kg|g|ml|l)(?![a-z])/i);
  if(!u) return null;
  let v = parseQ(m[2]); if(isNaN(v)) return null;
  const unit = u[1].toLowerCase();
  if(unit === 'kg') return {v:v*1000, d:'g'};
  if(unit === 'l') return {v:v*1000, d:'ml'};
  return {v:v, d:unit};
}
function fmtTotal(v, d){
  if(v >= 1000) return (Math.round(v/100)/10) + (d === 'g' ? 'kg' : 'L');
  return Math.round(v) + d;
}
function shopGroups(){
  const map = new Map();
  PREFS.shop.forEach(function(it, i){
    const g = shopGroupOf(it.t);
    if(!map.has(g.key)) map.set(g.key, {key:g.key, label:g.label, items:[]});
    map.get(g.key).items.push([it, i]);
  });
  const groups = [...map.values()];
  groups.forEach(function(g){
    g.done = g.items.every(p=>p[0].done);
    g.doneAt = Math.max.apply(null, g.items.map(p=>p[0].doneAt || 0));
    const live = g.items.find(p=>!p[0].done) || g.items[0];
    g.aisle = live[0].aisle;
    const qs = g.items.map(p=>shopQty(p[0].t));
    g.total = (g.items.length > 1 && qs.every(q=>q && q.d === qs[0].d))
      ? fmtTotal(qs.reduce((a,q)=>a+q.v, 0), qs[0].d) : '';
  });
  return groups;
}
function shopSources(){
  const out = [];
  PREFS.shop.forEach(function(it){
    let s = out.find(x=>x.from === it.from);
    if(!s){ s = {from:it.from, n:0, done:0}; out.push(s); }
    s.n++; if(it.done) s.done++;
  });
  return out;
}
let SHOP_GROUPS = [], SHOP_SOURCES = [], SHOP_DROP = null, SHOP_DROP_TIMER = null;

function shopText(){
  const groups = shopGroups();
  const line = function(g){
    if(g.items.length === 1) return g.items[0][0].t;
    return g.label + (g.total ? ' (' + g.total + ' total)' : '') + ': ' +
      g.items.map(p=>p[0].t + ' [' + p[0].from + ']').join('; ');
  };
  let out = 'The Kitchen Collection: shopping list\n';
  AISLE_ORDER.forEach(function(a){
    const gs = groups.filter(g=>!g.done && g.aisle === a);
    if(!gs.length) return;
    out += '\n' + a.toUpperCase() + '\n';
    gs.forEach(function(g){ out += '[ ] ' + line(g) + '\n'; });
  });
  const done = groups.filter(g=>g.done).sort((x,y)=>x.doneAt-y.doneAt);
  if(done.length){
    out += '\nTICKED OFF\n';
    done.forEach(function(g){ out += '[x] ' + line(g) + '\n'; });
  }
  return out;
}

function addToShop(ids){
  const have = new Set(PREFS.shop.map(x=>x.t+'|'+x.from));
  let added = 0;
  ids.forEach(function(id){
    const r = rec(id); if(!r || r.cat==='draft') return;
    added += addLines(r, plainIng(r).filter(isShoppable), have);
  });
  return added;
}

function addLines(r, lines, have){
  have = have || new Set(PREFS.shop.map(x=>x.t+'|'+x.from));
  const f = factorFor(r.id);
  const from = r.title + (f!==1 ? ' ('+serveText(r,f).toLowerCase()+')' : '');
  let added = 0;
  lines.forEach(function(l){
    const t = scaleLine(l, f);
    const k = t+'|'+from;
    if(!have.has(k)){ PREFS.shop.push({t:t, from:from, aisle:aisleFor(l), done:false}); have.add(k); added++; }
  });
  return added;
}
function addMissing(id){
  const r = rec(id);
  const have = new Set(PREFS.have || []);
  const lines = RINFO[id].lines.filter(x=>!x.opt && !have.has(x.key)).map(x=>x.line);
  return addLines(r, lines);
}

async function copyText(text){
  try{
    if(navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(text); return true; }
  }catch(e){}
  try{
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy'); document.body.removeChild(ta); return ok;
  }catch(e){ return false; }
}

/* ============================================================
   Timers
   ============================================================ */
let TIMERS = [], timerInt = null, actx = null, tSeq = 0;
function ensureAudio(){
  try{
    if(!actx){ const AC = window.AudioContext || window.webkitAudioContext; if(AC) actx = new AC(); }
    if(actx && actx.state === 'suspended') actx.resume();
  }catch(e){}
}
function beep(){
  try{
    if(!actx) return;
    const t0 = actx.currentTime;
    for(let i=0;i<3;i++){
      const o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(actx.destination);
      const st = t0 + i*0.45;
      g.gain.setValueAtTime(0.0001, st);
      g.gain.exponentialRampToValueAtTime(0.35, st+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, st+0.3);
      o.start(st); o.stop(st+0.32);
    }
  }catch(e){}
  try{ if(navigator.vibrate) navigator.vibrate([250,120,250,120,250]); }catch(e){}
}
function startTimer(secs, label){
  ensureAudio();
  TIMERS.push({id:++tSeq, label:label, end:Date.now()+secs*1000, done:false});
  if(!timerInt) timerInt = setInterval(tickTimers, 500);
  tickTimers();
  toast(durLabel(secs)+' timer started.');
}
function tickTimers(){
  const now = Date.now();
  TIMERS.forEach(function(t){
    if(!t.done && now >= t.end){ t.done = true; beep(); toast('Time: '+t.label); }
  });
  $('#timerlist').innerHTML = TIMERS.map(function(t){
    const left = (t.end - now)/1000;
    return '<div class="trow'+(t.done?' done':'')+'"><span class="tl">'+esc(t.label)+'</span>'+
      '<span class="tc">'+(t.done?'Done':fmtDur(left))+'</span>'+
      '<button data-tcancel="'+t.id+'">'+(t.done?'Dismiss':'Cancel')+'</button></div>';
  }).join('');
  document.body.style.paddingBottom = (96 + TIMERS.length*52) + 'px';
  if(!TIMERS.length && timerInt){ clearInterval(timerInt); timerInt = null; }
}

let pendingPhoto = null;
$('#filepick').addEventListener('change', async function(e){
  const f = e.target.files[0]; if(!f || !pendingPhoto) return;
  const id = pendingPhoto; pendingPhoto = null; e.target.value='';
  try{
    const data = await shrink(f, 900, 0.72);
    PHOTOS[id] = data;
    render(false);
    const ok = await IDB.set('photo:'+id, data);
    toast(ok ? 'Photo saved on this device.' : 'Photo added, but it will not be kept after closing.');
  }catch(err){ toast('That image could not be read. Try a JPEG or PNG.'); }
});

function shrink(file, maxDim, quality){
  return new Promise(function(res,rej){
    const fr = new FileReader();
    fr.onerror = function(){ rej(new Error('read')); };
    fr.onload = function(){
      const img = new Image();
      img.onerror = function(){ rej(new Error('decode')); };
      img.onload = function(){
        const scale = Math.min(1, maxDim/Math.max(img.width,img.height));
        const cv = document.createElement('canvas');
        cv.width = Math.round(img.width*scale); cv.height = Math.round(img.height*scale);
        cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
        res(cv.toDataURL('image/jpeg', quality));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* ============================================================
   Events
   ============================================================ */
document.addEventListener('click', async function(e){
  const sel = '[data-go],[data-tab],[data-tick],[data-fav],[data-shop],[data-cooked],[data-reset],[data-photo],'+
              '[data-shoptick],[data-shopdrop],[data-shopclear],[data-copyshop],[data-savelist],[data-loadlist],[data-meal],'+
              '[data-mealshop],[data-mealclear],[data-tbsp],[data-timer],[data-tcancel],'+
              '[data-serve],[data-servereset],[data-have],[data-haveclear],[data-addmissing],[data-jump]';
  const t = e.target.closest(sel);
  if(!t) return;
  const d = t.dataset;

  if(d.timer){ return startTimer(+d.timer, d.label || 'Timer'); }
  if(d.serve){ stepServe(d.id, +d.serve); render(false); return savePrefs(); }
  if(d.servereset){ delete PREFS.serves[d.servereset]; render(false); return savePrefs(); }
  if(d.have){
    const set = new Set(PREFS.have || []);
    if(set.has(d.have)) set.delete(d.have); else set.add(d.have);
    PREFS.have = [...set];
    render(false); return savePrefs();
  }
  if(d.haveclear){ PREFS.have = []; render(false); return savePrefs(); }
  if(d.addmissing){
    const n = addMissing(d.addmissing);
    toast(n ? n+' missing items added to the list.' : 'Already on the list.');
    return savePrefs();
  }
  if(d.jump){ const el = document.getElementById(d.jump); if(el) el.scrollIntoView({behavior:'smooth', block:'start'}); return; }
  if(d.tcancel){ TIMERS = TIMERS.filter(x=>x.id !== +d.tcancel); return tickTimers(); }

  if(d.go){
    view = {name:d.go, id:d.id||null, q:''};
    if(view.name==='recipe') ticks = {ing:new Set(), step:new Set()};
    return render();
  }
  if(d.tab){ view = {name:d.tab, id:null, q:'', hq:''}; return render(); }

  if(d.tick){
    const set = ticks[d.tick]; const i = +d.i;
    if(set.has(i)) set.delete(i); else set.add(i);
    return render(false);
  }
  if(d.reset){ ticks = {ing:new Set(), step:new Set()}; return render(false); }

  if(d.tbsp){ PREFS.tbsp = +d.tbsp; render(false); return savePrefs(); }

  if(d.fav){
    if(PREFS.fav.includes(d.fav)) PREFS.fav = PREFS.fav.filter(x=>x!==d.fav);
    else PREFS.fav.push(d.fav);
    render(false); return savePrefs();
  }
  if(d.cooked){
    PREFS.cooked[d.cooked] = new Date().toISOString().slice(0,10);
    render(false); toast('Logged for today.'); return savePrefs();
  }
  if(d.shop){
    const added = addToShop([d.shop]);
    toast(added ? added+' items added to the list.' : 'Already on the list.');
    return savePrefs();
  }
  if(d.shoptick){
    const g = SHOP_GROUPS[+d.shoptick]; if(!g) return;
    const now = Date.now(), to = !g.done;
    g.items.forEach(function(p){ p[0].done = to; if(to) p[0].doneAt = now; else delete p[0].doneAt; });
    render(false); return savePrefs();
  }
  if(d.shopdrop){
    const src = SHOP_SOURCES[+d.shopdrop]; if(!src) return;
    clearTimeout(SHOP_DROP_TIMER);
    if(SHOP_DROP !== src.from){
      SHOP_DROP = src.from;
      SHOP_DROP_TIMER = setTimeout(function(){ SHOP_DROP = null; if(view.name === 'shop') render(false); }, 4000);
      return render(false);
    }
    SHOP_DROP = null;
    const before = PREFS.shop.length;
    PREFS.shop = PREFS.shop.filter(it=>it.from !== src.from);
    render(false); toast('Removed ' + (before - PREFS.shop.length) + ' lines from ' + src.from + '.');
    return savePrefs();
  }
  if(d.shopclear){ PREFS.shop = []; render(false); return savePrefs(); }
  if(d.copyshop){
    const ok = await copyText(shopText());
    return toast(ok ? 'List copied.' : 'Copy failed. Select and copy by hand.');
  }
  if(d.savelist){
    if(!PREFS.shop.length) return toast('Nothing to save yet.');
    let name = null;
    try{ name = prompt('Name this list', 'Shop ' + niceDate(new Date().toISOString())); }catch(err){ name = 'Shop ' + niceDate(new Date().toISOString()); }
    if(!name) return;
    PREFS.lists.unshift({name:name, items:PREFS.shop.slice(), date:new Date().toISOString()});
    PREFS.lists = PREFS.lists.slice(0,12);
    render(false); toast('List saved.'); return savePrefs();
  }
  if(d.loadlist){
    const l = PREFS.lists[+d.loadlist];
    PREFS.shop = l.items.map(x=>Object.assign({}, x));
    render(false); toast('Loaded ' + l.name + '.'); return savePrefs();
  }

  if(d.meal){
    const ids = [d.meal].concat(PAIRS[d.meal]||[]);
    ids.forEach(function(id){ if(!PREFS.meal.includes(id)) PREFS.meal.push(id); });
    view = {name:'meal', id:null, q:''};
    render();
    toast('Meal built. Send the ingredients across when ready.');
    return savePrefs();
  }
  if(d.mealshop){
    const added = addToShop(PREFS.meal);
    view = {name:'shop', id:null, q:''};
    render();
    toast(added ? added+' items added.' : 'Already on the list.');
    return savePrefs();
  }
  if(d.mealclear){ PREFS.meal = []; render(false); return savePrefs(); }

  if(d.photo){ pendingPhoto = d.photo; $('#filepick').click(); }
});

document.addEventListener('input', function(e){
  if(e.target.id==='q'){ view.q = e.target.value; runSearch(view.q); }
  if(e.target.id==='hq'){ view.hq = e.target.value; applyChipFilter(); }
});

/* ============================================================
   Go
   ============================================================ */
(async function(){
  await loadAll();
  render();
  connectCloud();
})();
</script>
